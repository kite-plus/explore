# Explore in production: PostgreSQL, a one-off migration, the API, the worker
# and the web frontend. Settings come from deploy/.env; copy .env.example.
# A reverse proxy in front terminates TLS; see
# docs/design/project-layout.md section 10.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: explore
      POSTGRES_DB: explore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - explore-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "explore"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${EXPLORE_IMAGE:-kiteplus/explore:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["migrate", "up"]
    env_file: .env
    environment:
      EXPLORE_DATABASE_URL: postgres://explore:${POSTGRES_PASSWORD}@postgres:5432/explore?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  serve:
    image: ${EXPLORE_IMAGE:-kiteplus/explore:latest}
    command: ["serve"]
    restart: unless-stopped
    env_file: .env
    environment:
      EXPLORE_DATABASE_URL: postgres://explore:${POSTGRES_PASSWORD}@postgres:5432/explore?sslmode=disable
      # web calls the API for readers; trusting this network lets the rate
      # limit see the reader's address rather than web's.
      EXPLORE_TRUSTED_PROXIES: ${EXPLORE_TRUSTED_PROXIES:-10.89.0.0/24}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${EXPLORE_IMAGE:-kiteplus/explore:latest}
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      EXPLORE_DATABASE_URL: postgres://explore:${POSTGRES_PASSWORD}@postgres:5432/explore?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${EXPLORE_WEB_IMAGE:-kiteplus/explore-web:latest}
    build:
      context: ../web
    restart: unless-stopped
    environment:
      EXPLORE_API_URL: http://serve:8080
      EXPLORE_PUBLIC_URL: ${EXPLORE_PUBLIC_URL:-https://explore.kite.plus}
      EXPLORE_SITE_VERIFICATION_BAIDU: ${EXPLORE_SITE_VERIFICATION_BAIDU:-}
      EXPLORE_SITE_VERIFICATION_GOOGLE: ${EXPLORE_SITE_VERIFICATION_GOOGLE:-}
    ports:
      - "127.0.0.1:4321:4321"
    depends_on:
      - serve

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  explore-db:
