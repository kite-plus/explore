# Explore in production, from the published images: Caddy for HTTPS,
# PostgreSQL, a one-off migration, the API, the worker and the web frontend.
# Put this file, Caddyfile and .env (copied from .env.example) in one
# directory on the server and run `docker compose up -d`; see
# docs/design/project-layout.md section 10.
name: explore

x-backend: &backend
  image: ghcr.io/kite-plus/explore:${EXPLORE_VERSION:-latest}
  env_file: .env
  environment:
    EXPLORE_DATABASE_URL: postgres://explore:${POSTGRES_PASSWORD}@postgres:5432/explore?sslmode=disable
    # Caddy and web call the API from this network; trusting it lets the
    # rate limit see the reader's address rather than theirs.
    EXPLORE_TRUSTED_PROXIES: ${EXPLORE_TRUSTED_PROXIES:-10.89.0.0/24}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      EXPLORE_PUBLIC_URL: ${EXPLORE_PUBLIC_URL:?set EXPLORE_PUBLIC_URL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - serve
      - web

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: explore
      POSTGRES_DB: explore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - explore-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "explore"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  serve:
    <<: *backend
    command: ["serve"]
    restart: unless-stopped
    # Also on the host's loopback, for a reverse proxy other than Caddy.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/kite-plus/explore-web:${EXPLORE_VERSION:-latest}
    restart: unless-stopped
    environment:
      EXPLORE_API_URL: http://serve:8080
      EXPLORE_PUBLIC_URL: ${EXPLORE_PUBLIC_URL:?set EXPLORE_PUBLIC_URL in .env}
      EXPLORE_SITE_VERIFICATION_BAIDU: ${EXPLORE_SITE_VERIFICATION_BAIDU:-}
      EXPLORE_SITE_VERIFICATION_GOOGLE: ${EXPLORE_SITE_VERIFICATION_GOOGLE:-}
    ports:
      - "127.0.0.1:4321:4321"
    depends_on:
      - serve

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  explore-db:
  caddy-data:
  caddy-config:
